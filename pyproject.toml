[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-pipeline"
version = "0.2.0"
description = "Local-only evidence-processing framework for floor-plan reconstruction. Ships with synthetic fixtures only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Upper bounds are deliberate: each dependency is exercised by the synthetic
# end-to-end test, and a major-version bump must be re-verified before use.
dependencies = [
    "ezdxf>=1.3,<2",
    "Pillow>=10.1,<14",
    "numpy>=1.24,<3",
    "jsonschema>=4.18,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10",
    "hypothesis>=6.80,<7",
    "ruff>=0.6,<1",
    "mypy>=1.8,<2",
    "types-PyYAML",
    "types-jsonschema",
    "build>=1.0,<2",
]

[project.scripts]
blueprint = "blueprint_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blueprint_pipeline = ["schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: multi-process or end-to-end tests",
]
filterwarnings = ["error::DeprecationWarning:blueprint_pipeline.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "E501",   # line length is enforced by ruff format; leftovers are long f-strings
    "S603",   # subprocess with trusted, list-form args only
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in docs strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108", "S310", "S311", "B017"]

[tool.mypy]
files = ["src/blueprint_pipeline"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ezdxf.*"]
ignore_missing_imports = true
