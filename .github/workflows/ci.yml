name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy
      - name: Network audit
        run: python scripts/audit_network_usage.py src
      - name: Tests
        run: python -m pytest -q
      - name: Synthetic end-to-end
        run: blueprint run-synthetic --report synthetic-report.md
      - name: Build
        run: python -m build
